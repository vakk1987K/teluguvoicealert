name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Telugu Soundbox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        run: |
          set -e

          # 1. Switch into android directory if present
          if [ -d "android" ]; then
            echo "Entering android/ directory..."
            cd android
          fi

          # 2. Fix Windows CRLF line endings in gradlew if uploaded from Windows
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

          # 3. Compile directly with Gradle 8.4
          echo "Compiling APK with Gradle 8.4..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeluguSoundbox-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
