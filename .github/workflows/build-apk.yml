name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile UPI Sound Box APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build Debug APK and Play Store AAB Bundle
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Entering android/ directory..."
            cd android
          fi

          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

          echo "Building APK and Play Store AAB with Gradle 8.4..."
          gradle assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: UPISoundBox-Testing-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: UPISoundBox-PlayStore-AAB
          path: |
            **/app/build/outputs/bundle/release/*.aab
            **/build/outputs/bundle/release/*.aab
          retention-days: 30
