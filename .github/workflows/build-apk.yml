name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Telugu Soundbox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          # 1. Detect directory structure (checks if files are in android/ or in root)
          if [ -d "android" ]; then
            echo "Entering android directory..."
            cd android
          fi

          # 2. Grant permissions
          chmod +x gradlew || true

          # 3. Generate wrapper jar if it was missed during manual upload
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.2 || true
          fi

          # 4. Compile the APK
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeluguSoundbox-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
