name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile UPI Sound Box APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build Debug APK and Play Store AAB Bundle
        run: |
          set -e

          # 1. Switch into android directory if present
          if [ -d "android" ]; then
            echo "Entering android/ directory..."
            cd android
          fi

          # 2. Fix Windows CRLF line endings in gradlew if uploaded from Windows
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

          # 3. Create persistent Production Release Keystore for Play Store
          echo "Setting up Release Signing Keystore..."
          echo "" | base64 -d > app/release.keystore

          # 4. Compile both APK (for testing) and Production Release AAB (for Google Play Console)
          echo "Building APK and Play Store Release AAB with Gradle 8.4..."
          gradle assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: UPISoundBox-Testing-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: UPISoundBox-PlayStore-AAB
          path: |
            **/app/build/outputs/bundle/release/*.aab
            **/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Backup Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: UPISoundBox-Release-Keystore
          path: |
            **/app/release.keystore
          retention-days: 90
